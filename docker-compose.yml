services:

  # ─── Kafka (KRaft mode) ───────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "bluesky-kafka-cluster-01"
      KAFKA_MESSAGE_MAX_BYTES: "200000000"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "200000000"
      KAFKA_SOCKET_REQUEST_MAX_BYTES: "200000000"
      KAFKA_FETCH_MESSAGE_MAX_BYTES: "200000000"
    ports:
      - "9092:9092"
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hadoop-net
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - bluesky.posts
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    restart: "no"

  kafka-init-reddit:
    image: apache/kafka:3.9.1
    container_name: kafka-init-reddit
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hadoop-net
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - reddit.posts
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    restart: "no"

  # ─── HDFS NameNode ────────────────────────────────────────────────────────
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    environment:
      CLUSTER_NAME: bluesky-hadoop
    env_file:
      - hadoop.env
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      - hadoop-net
    healthcheck:
      # Enhanced healthcheck to ensure NameNode is actually responding to HDFS commands
      test: ["CMD", "hdfs", "dfsadmin", "-safemode", "get"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── HDFS Initialization (NEW) ──────────────────────────────────────────
  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-init
    env_file:
      - hadoop.env
    networks:
      - hadoop-net
    depends_on:
      namenode:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for NameNode to exit Safe Mode..."
        hdfs dfsadmin -safemode wait
        echo "Creating Spark checkpoint directory..."
        hdfs dfs -mkdir -p /tmp/spark-sentiment-checkpoint
        echo "Creating raw and processed batch directories..."
        hdfs dfs -mkdir -p /bluesky/raw /bluesky/processed
        echo "Setting global permissions for /tmp..."
        hdfs dfs -chmod -R 777 /tmp
        echo "Setting global permissions for /bluesky..."
        hdfs dfs -chmod -R 777 /bluesky
        echo "HDFS Initialization complete."
    restart: "no"

  # ─── HDFS DataNode 1 ──────────────────────────────────────────────────────
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    hostname: datanode1
    ports:
      - "9864:9864"
    env_file:
      - hadoop.env
    volumes:
      - datanode1_data:/hadoop/dfs/data
    networks:
      - hadoop-net
    depends_on:
      namenode:
        condition: service_healthy
    restart: unless-stopped

  # ─── HDFS DataNode 2 ──────────────────────────────────────────────────────
  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    hostname: datanode2
    ports:
      - "9865:9864"
    env_file:
      - hadoop.env
    volumes:
      - datanode2_data:/hadoop/dfs/data
    networks:
      - hadoop-net
    depends_on:
      namenode:
        condition: service_healthy
    restart: unless-stopped

  # ─── Bluesky Bridge (WebSocket → TCP) ─────────────────────────────────────
  bluesky-bridge:
    build: ./bridge
    container_name: bluesky-bridge
    hostname: bluesky-bridge
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hadoop-net
    ports:
      - "9999:9999"   # optional (for debugging)
    restart: unless-stopped

  # ─── Reddit Bridge (Reddit JSON → Kafka) ─────────────────────────────────
  reddit-bridge:
    build: ./reddit-bridge
    container_name: reddit-bridge
    hostname: reddit-bridge
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_TOPIC=reddit.posts
      - REDDIT_URL=https://www.reddit.com/r/all/new.json?limit=100
    networks:
      - hadoop-net
    restart: unless-stopped

  # ─── HDFS Collector (TCP → HDFS) ──────────────────────────────────────────
  hdfs-collector:
    build: ./collector
    container_name: hdfs-collector
    hostname: hdfs-collector
    environment:
      BRIDGE_HOST: bluesky-bridge
      BRIDGE_PORT: "9999"
      HDFS_HOST: namenode
      HDFS_PORT: "9870"
      HDFS_DIR: /bluesky/raw
      FLUSH_EVERY: "50"
      KAFKA_HOST: kafka
      KAFKA_PORT: "9092"
      KAFKA_TOPICS: "bluesky.posts,reddit.posts"
    networks:
      - hadoop-net
    depends_on:
      namenode:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
      bluesky-bridge:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      kafka-init-reddit:
        condition: service_completed_successfully
    restart: unless-stopped
  # ─── Spark Master ────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    networks:
      - hadoop-net

  # ─── Spark Worker ────────────────────────────────────────────────────────
  spark-worker:
    build: ./spark
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_INSTANCES=1
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - hadoop-net

  # ─── Spark Streaming Job ─────────────────────────────────────────────────
  spark-app:
    build: ./spark
    container_name: spark-app
    depends_on:
      spark-master:
        condition: service_started
      namenode:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully # Ensure permissions are set first
      kafka-init:
        condition: service_completed_successfully
      kafka-init-reddit:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./hadoop-config:/opt/hadoop/etc/hadoop
      - spark_ivy_cache:/home/spark/.ivy2
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - KAFKA_TOPICS=bluesky.posts,reddit.posts
    networks:
      - hadoop-net
      
  # ─── PostgreSQL for sentiment analytics persistence ───────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: bluesky
      POSTGRES_PASSWORD: bluesky_postgres_pwd
      POSTGRES_DB: sentiment_analytics
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bluesky", "-d", "sentiment_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  streamlit-dashboard:
    build: ./dashboard
    container_name: streamlit-dashboard
    ports:
      - "8501:8501"
    networks:
      - hadoop-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Elasticsearch (batch analytics sink) ─────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Kibana removed — Grafana will use Elasticsearch indices for batch dashboards

  # ─── Batch job: Spark-based HDFS -> Elasticsearch processor ───────────
  batch-spark:
    build: ./batch-spark
    container_name: batch-spark
    hostname: batch-spark
    environment:
      HDFS_HOST: namenode
      HDFS_PORT: "9870"
      HDFS_RAW_DIR: /bluesky/raw
      HDFS_OUT_DIR: /bluesky/processed
      ELASTIC_URL: http://elasticsearch:9200
      ELASTIC_INDEX_TOPICS: batch_topics
      ELASTIC_INDEX_TRENDS: batch_trends
      ELASTIC_INDEX_EVENTS: batch_events
      LOOKBACK_DAYS: "90"
      BATCH_INTERVAL_SECONDS: "300"
      CLUSTERING_K: "50"
      EVENT_WINDOW_HOURS: "6"
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    networks:
      - hadoop-net
    restart: "no"

  # ─── Elasticsearch (batch analytics sink) ─────────────────────────────────
  # (Elasticsearch/Kibana and batch indexing removed — kept Reddit→Kafka→HDFS only)

  # ─── Prometheus (metrics scraper) ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    hostname: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hadoop-net
    restart: unless-stopped

  # ─── Grafana (visualisation) ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - postgres
    networks:
      - hadoop-net
    restart: unless-stopped

  # ─── Postgres Exporter (DB metrics for Prometheus) ────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    hostname: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://bluesky:bluesky_postgres_pwd@postgres:5432/sentiment_analytics?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hadoop-net
    restart: unless-stopped

  # ─── Kafka Exporter (broker/topic/consumer-group metrics) ─────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    hostname: kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hadoop-net
    restart: unless-stopped

  # ─── cAdvisor (per-container CPU / memory / IO) ───────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    hostname: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - hadoop-net
    restart: unless-stopped

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
  spark_ivy_cache:
  postgres_data:
  prometheus_data:
  grafana_data:

# ─── Network ────────────────────────────────────────────────────────────────
networks:
  hadoop-net:
    driver: bridge