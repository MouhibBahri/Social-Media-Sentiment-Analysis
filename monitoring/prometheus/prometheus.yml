global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "sentiment-pipeline"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "bluesky-bridge"
    static_configs:
      - targets: ["bluesky-bridge:8000"]
        labels:
          component: "bridge"
          source: "bluesky"

  - job_name: "reddit-bridge"
    static_configs:
      - targets: ["reddit-bridge:8000"]
        labels:
          component: "bridge"
          source: "reddit"

  - job_name: "hdfs-collector"
    static_configs:
      - targets: ["hdfs-collector:8000"]
        labels:
          component: "collector"

  - job_name: "spark-app"
    static_configs:
      - targets: ["spark-app:8000"]
        labels:
          component: "spark-stream"

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: "postgres"

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          component: "kafka"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: "containers"
